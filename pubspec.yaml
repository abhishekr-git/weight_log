name: weightlog
description: Offline-first workout tracker with weekly templates, fast set logging, and cloud backup.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.0
  connectivity_plus: ^6.1.0
  csv: ^6.0.0
  firebase_auth: ^5.3.4
  firebase_core: ^3.8.1
  fl_chart: ^0.69.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.20.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
